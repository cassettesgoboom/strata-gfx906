name: gfx906 CPU tooling

on:
  push:
    paths:
      - 'README.md'
      - 'tools/gfx906.py'
      - 'tests/gfx906/**'
      - 'tests/core/batch_transaction_test.cpp'
      - 'include/strata/core/batch_transaction.hpp'
      - 'include/strata/core/verify.hpp'
      - 'src/core/verify.cpp'
      - 'CMakeLists.txt'
      - 'benchmarks/gfx906/**'
      - 'docs/gfx906/**'
      - '.github/workflows/gfx906-cpu.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'tools/gfx906.py'
      - 'tests/gfx906/**'
      - 'tests/core/batch_transaction_test.cpp'
      - 'include/strata/core/batch_transaction.hpp'
      - 'include/strata/core/verify.hpp'
      - 'src/core/verify.cpp'
      - 'CMakeLists.txt'
      - 'benchmarks/gfx906/**'
      - 'docs/gfx906/**'
      - '.github/workflows/gfx906-cpu.yml'

permissions:
  contents: read

jobs:
  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: CPU-only tests
        run: python tools/gfx906.py test-cpu
      - name: Batch transaction lifecycle contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Iinclude tests/core/batch_transaction_test.cpp -o "$RUNNER_TEMP/batch_transaction_test"
          "$RUNNER_TEMP/batch_transaction_test"
      - name: Validate synthetic fixture is rejected as run evidence
        run: |
          set +e
          output="$(python tools/gfx906.py bench-validate tests/gfx906/fixtures/synthetic-not-run.json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$output" = $'INVALID: tests/gfx906/fixtures/synthetic-not-run.json\n  - synthetic fixture cannot be reported as run evidence'
